{% extends "base.html" %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body p-4">
        <h2>Welcome, {{ full_name }}!</h2>
        <p class="text-muted">{{ email }}</p>

        <hr>

        <h4>Your SmartTrip Dashboard</h4>
        <p>Your account is working successfully.</p>

        <div class="d-flex flex-wrap gap-2">
            <a href="{{ url_for('create_trip') }}" class="btn btn-primary">
    Create Trip
</a>
            <a href="/trip-history" class="btn btn-outline-primary">
    Trip History
</a>

<a href="/account" class="btn btn-outline-secondary">
    My Account
</a>
            <a href="{{ url_for('logout') }}" class="btn btn-danger">Logout</a>
        </div>
    </div>
</div>
{% endblock %}
