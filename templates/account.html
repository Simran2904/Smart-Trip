{% extends "base.html" %}

{% block content %}

<div class="container mt-4 mb-5">

    <div class="card shadow-sm p-4">

        <h2>My Account</h2>

        <p class="text-muted">
            View your registered account information.
        </p>

        <hr>

        <div class="mb-3">
            <label class="form-label fw-bold">
                Full Name
            </label>

            <input type="text"
                   class="form-control"
                   value="{{ full_name }}"
                   readonly>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">
                Email Address
            </label>

            <input type="email"
                   class="form-control"
                   value="{{ email }}"
                   readonly>
        </div>

        <div class="alert alert-success">
            Your SmartTrip account is active.
        </div>

        <a href="{{ url_for('dashboard') }}"
           class="btn btn-secondary">
            Back to Dashboard
        </a>

    </div>

</div>

{% endblock %}
